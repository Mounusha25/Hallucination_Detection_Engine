# Hallucination Detection Engine configuration
retrieval:
  top_k: 3

scoring:
  support_threshold: 0.70
  hallucination_threshold: 0.50
  contradiction_floor: 0.90

models:
  # Optional Milestone 2 adapters; the core evaluator is deterministic.
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  nli_model: "cross-encoder/nli-deberta-v3-base"

app:
  port: 8000
  max_response_chars: 20000
  max_evidence_documents: 100
