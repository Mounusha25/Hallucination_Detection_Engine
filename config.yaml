# Hallucination Detection Engine configuration
retrieval:
  top_k: 3
  lexical_weight: 0.4
  semantic_weight: 0.6

scoring:
  support_threshold: 0.70
  hallucination_threshold: 0.50
  contradiction_floor: 0.90

models:
  embedding_provider: "ollama"
  embedding_model: "bge-m3"
  nli_provider: "ollama"
  nli_model: "qwen3:4b-instruct"
  rubric_provider: "ollama"
  rubric_model: "qwen3:4b-instruct"

rubric:
  dimensions: ["correctness", "relevance", "completeness", "faithfulness"]
  pass_threshold: 0.70
  calibration_tolerance: 0.25

app:
  port: 8000
  max_response_chars: 20000
  max_evidence_documents: 100
